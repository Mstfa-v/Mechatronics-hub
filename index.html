const rob=()=>$('#robot'),rset=(c,on)=>rob()&&rob().classList.toggle(c,on);
const look=(x,y)=>$$('.pupil').forEach(p=>p.style.transform=`translate(${x*5}px,${y*4}px)`);
addEventListener('pointermove',e=>{const r=rob();if(!r||r.classList.contains('shut')||['ae','an'].includes(document.activeElement.id))return;const b=r.getBoundingClientRect(),dx=e.clientX-(b.left+b.width/2),dy=e.clientY-(b.top+b.height*.45),d=Math.hypot(dx,dy)||1,k=Math.min(1,d/220);look(dx/d*k,dy/d*k)});
setInterval(()=>{const r=rob();if(r&&!r.classList.contains('shut')){r.classList.add('blink');setTimeout(()=>r.classList.remove('blink'),160)}},3600);

/* ===== routes ===== */
const view=h=>{app.classList.remove('busy');app.innerHTML=h;scrollTo({top:0,behavior:'instant'})};
async function route(){app.classList.add('busy');setTimeout(()=>app.classList.remove('busy'),6000);
  const p=(location.hash||'#/').slice(2).split('/');
  try{if(p[0]==='login')loginPage();else if(p[0]==='s')await subjectPage(p[1],p[2]);else if(p[0]==='news')await news();else if(p[0]==='admin')await admin();else await home()}
  catch(e){fail(e);view(`<div class="empty" style="margin-top:30px">${t('loadfail')}</div>`)}
}
addEventListener('hashchange',route);

function loginPage(){
  if(me){location.hash='#/';return}
  let su=false;
  view(`<div class="lg"><div class="rw up">${ROBOT}</div><form class="f up" id="af"><h2 id="at" style="margin:0"></h2>
  <label id="nl" hidden>${t('name')}<input id="an" autocomplete="name"></label><label>${t('email')}<input id="ae" type="email" required autocomplete="email"></label>
  <label>${t('pass')}<span class="pw"><input id="ap" type="password" required minlength="6" autocomplete="current-password"><button class="b s" id="eye" type="button">${t('show')}</button></span></label>
  <p class="msg" id="am"></p><button class="b p" id="as"></button><button class="b" type="button" id="sw"></button><button class="b s" type="button" id="fg">${t('forgot')}</button></form></div>`);
  const mode=s=>{su=s;$('#at').textContent=t(s?'signup':'signin');$('#as').textContent=t(s?'signup':'signin');$('#sw').textContent=t(s?'haveacc':'signup');$('#nl').hidden=!s;$('#am').textContent='';$('#ap').autocomplete=s?'new-password':'current-password';rset('party',s)};
  mode(false);$('#sw').onclick=()=>mode(!su);
  const typing=e=>look(Math.min(e.target.value.length,26)/26*1.6-.8,.5);
  ['ae','an'].forEach(i=>{$('#'+i).oninput=typing;$('#'+i).onfocus=typing});
  $('#ap').onfocus=()=>rset('shut',true);$('#ap').onblur=()=>{rset('shut',false);rset('peek',false);look(0,0)};
  $('#eye').onclick=()=>{const p=$('#ap'),s=p.type==='password';p.type=s?'text':'password';$('#eye').textContent=t(s?'hide':'show');rset('peek',s)};
  $('#fg').onclick=async()=>{const em=$('#ae').value.trim();if(!em)return toast(t('typeemail'));const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});error?fail(error):toast(t('resetsent'))};
  $('#af').onsubmit=async e=>{e.preventDefault();const b=$('#as');b.disabled=true;$('#am').textContent='';const email=$('#ae').value.trim(),password=$('#ap').value;
    try{
      if(su){const {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:$('#an').value.trim()}}});if(error)throw error;
        if(!data.session){$('#am').style.color='var(--acc2)';$('#am').textContent=t('confirm');rset('jump',true);setTimeout(()=>rset('jump',false),900);return}}
      else{const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw error}
      rset('shut',false);rset('jump',true);toast(t(su?'created':'welcome'));await loadMe();setTimeout(()=>location.hash='#/',900)
    }catch(err){$('#am').style.color='#c0392b';$('#am').textContent=err.message||'Error';rset('sad',true);setTimeout(()=>rset('sad',false),700)}finally{b.disabled=false}};
}

const sCard=s=>`<a class="card${NEWS.has(s.id)?' hasnew':''}" href="#/s/${esc(s.slug)}">${NEWS.has(s.id)?`<i class="new">${t('newb')}</i>`:''}${s.hidden?`<i class="tag">${t('hiddenb')}</i>`:''}<h3>${esc(nm(s))}</h3></a>`;
const nRow=a=>`<div class="row"><div><b>${esc(a.title)}</b><small>${fmt(a.created_at)}</small>${a.body?`<div>${esc(a.body)}</div>`:''}</div></div>`;
async function home(){
  const [{data:subs,error:e1},{data:an},{data:rc}]=await Promise.all([getSubs(),sb.from('mt_announcements').select('*').order('created_at',{ascending:false}).limit(3),sb.from('mt_resources').select('subject_id,created_at').gte('created_at',new Date(Date.now()-8*36e5).toISOString())]);
  const list=(subs&&subs.length)?subs:(e1?FB:[]);
  NEWS.clear();{const f={},sn=SEEN.get();(rc||[]).filter(r=>new Date(r.created_at)>Date.now()-8*36e5).forEach(r=>{if(!f[r.subject_id]||r.created_at>f[r.subject_id])f[r.subject_id]=r.created_at});Object.keys(f).forEach(id=>{if(!sn[id]||f[id]>sn[id])NEWS.add(id)})}
  view(`${e1?`<p class="empty" style="margin:16px 0 0">${t('preview')}</p>`:''}<section class="hero"><div class="up"><h1>${t('h1')}</h1><p>${t('herop')}</p>
  <a class="b p" href="#subs" onclick="event.preventDefault();document.getElementById('subs').scrollIntoView()">${t('browse')}</a></div>
  <svg class="gears up" viewBox="0 0 240 240" fill="none" stroke="currentColor" aria-hidden="true"><g class="g1"><circle cx="90" cy="100" r="56" stroke-width="16" stroke-dasharray="11.2 11.2" style="color:var(--ink)"/><circle cx="90" cy="100" r="46" stroke-width="3" style="color:var(--ink)"/><circle cx="90" cy="100" r="12" stroke-width="4" style="color:var(--acc)"/></g><g class="g2"><circle cx="178" cy="172" r="38" stroke-width="12" stroke-dasharray="9.9 9.9" style="color:var(--acc)"/><circle cx="178" cy="172" r="31" stroke-width="3" style="color:var(--acc)"/><circle cx="178" cy="172" r="8" stroke-width="3" style="color:var(--ink)"/></g></svg></section>
  <h2 id="subs">${t('subjects')}</h2><div class="grid">${list.map(sCard).join('')||`<div class="empty">${t('nosubs')}</div>`}</div>
  ${an&&an.length?`<div class="vh" style="margin:40px 0 16px"><h2 style="margin:0">${t('latest')}</h2><a class="b s" href="#/news">${t('all')}</a></div>${an.map(nRow).join('')}`:''}`);
}
async function news(){
  const {data,error}=await sb.from('mt_announcements').select('*').order('created_at',{ascending:false});if(error&&!OFFLINE)throw error;
  view(`<h2>${t('news')}</h2>${(data||[]).map(nRow).join('')||`<div class="empty">${t('nonews')}</div>`}`);
}
const dlUrl=r=>B().getPublicUrl(r.file_path,{download:(r.title||'file').replace(/[^\w\u0600-\u06FF .-]+/g,'_')+'.pdf'}).data.publicUrl;
async function subjectPage(slug,sec){
  sec=SECS.includes(sec)?sec:'doctor_book';
  let s=((await getSubs()).data||[]).find(x=>x.slug===slug);if(!s){({data:s}=await sb.from('mt_subjects').select('*').eq('slug',slug).maybeSingle())}if(!s&&OFFLINE)s=FB.find(x=>x.slug===slug);
  if(!s)return view(`<div class="empty" style="margin-top:30px">${t('notfound')} <a href="#/">${t('allsubs')}</a></div>`);SEEN.set(s.id);
  const {data:rs,error}=await sb.from('mt_resources').select('*').eq('subject_id',s.id).eq('section',sec).order('created_at',{ascending:false});if(error&&!OFFLINE)throw error;
  view(`<p style="margin-top:26px"><a href="#/">${t('allsubs')}</a></p><h2 style="margin-top:6px" class="up">${esc(nm(s))}</h2>
  <div class="tabs">${SECS.map(k=>`<a class="b s ${k===sec?'on':''}" href="#/s/${esc(slug)}/${k}">${t(k)}</a>`).join('')}</div>
  ${(rs||[]).map(r=>`<div class="row"><div><b>${esc(r.title)}</b><small>${fmt(r.created_at)}</small></div><div class="act"><button class="b s p" data-view="${esc(r.file_path)}" data-title="${esc(r.title)}" data-dl="${esc(dlUrl(r))}" type="button">${t('view')}</button><a class="b s" href="${esc(dlUrl(r))}">${t('download')}</a>${isAdmin()?`<button class="b s d" data-del="${r.id}" data-path="${esc(r.file_path)}" type="button">${t('del')}</button>`:''}</div></div>`).join('')||`<div class="empty">${t('nofiles')}</div>`}`);
}

/* ===== admin ===== */
async function admin(){
  if(!isAdmin())return view(`<div class="empty" style="margin-top:40px"><h2>${t('adminsonly')}</h2><p>${t('adminsonlyp')}</p></div>`);
  const tabs=[['upload','upload'],['files','files'],['news','news'],['subjects','subjects']];if(me.role==='super_admin')tabs.push(['users','users']);
  if(!tabs.some(x=>x[0]===at))at='upload';
  const {data:subs}=await getSubs();
  let body='';
  if(at==='upload')body=`<form class="f" id="uf"><label>${t('subject')}<select id="us" required>${(subs||[]).map(s=>`<option value="${s.id}">${esc(nm(s))}</option>`).join('')}</select></label><label>${t('sect')}<select id="uc">${SECS.map(k=>`<option value="${k}">${t(k)}</option>`).join('')}</select></label><label>${t('title')}<input id="ut" required maxlength="140"></label><label>${t('pdf')}<input id="uf2" type="file" accept="application/pdf" required></label><button class="b p" id="ub">${t('uploadb')}</button></form>`;
  if(at==='files'){const {data}=await sb.from('mt_resources').select('id,title,section,file_path,created_at,mt_subjects(name,name_ar)').order('created_at',{ascending:false}).limit(100);
    body=(data||[]).map(r=>`<div class="row"><div><b>${esc(r.title)}</b><small>${esc(r.mt_subjects?nm(r.mt_subjects):'')} / ${t(r.section)} / ${fmt(r.created_at)}</small></div><button class="b s d" data-del="${r.id}" data-path="${esc(r.file_path)}" type="button">${t('del')}</button></div>`).join('')||`<div class="empty">${t('nofiles')}</div>`}
  if(at==='news'){const {data}=await sb.from('mt_announcements').select('*').order('created_at',{ascending:false});
    body=`<form class="f" id="nf"><label>${t('title')}<input id="nt" required maxlength="140"></label><label>${t('details')}<textarea id="nb" rows="3"></textarea></label><button class="b p">${t('post')}</button></form>`+(data||[]).map(a=>`<div class="row"><div><b>${esc(a.title)}</b><small>${fmt(a.created_at)}</small></div><button class="b s d" data-deln="${a.id}" type="button">${t('del')}</button></div>`).join('')}
  if(at==='subjects')body=`<form class="f" id="sf"><label>${t('nameEn')}<input id="sn" required maxlength="80" dir="ltr"></label><label>${t('nameAr')}<input id="sa" maxlength="80" dir="rtl"></label><button class="b p">${t('addsub')}</button></form>`+(subs||[]).map((s,i)=>`<div class="row"><div><b>${esc(s.name)}</b><small>${esc(s.name_ar||'')} ${s.hidden?'· '+t('hiddenb'):''}</small></div><div class="act"><button class="b s" data-mv="${i}" data-d="-1" type="button" ${i?'':'disabled'}>↑</button><button class="b s" data-mv="${i}" data-d="1" type="button" ${i<subs.length-1?'':'disabled'}>↓</button><button class="b s" data-ren="${s.id}" data-n="${esc(s.name)}" data-a="${esc(s.name_ar||'')}" type="button">${t('rename')}</button><button class="b s" data-hid="${s.id}" data-h="${s.hidden}" type="button">${t(s.hidden?'showbtn':'hidebtn')}</button><button class="b s d" data-dels="${s.id}" type="button">${t('del')}</button></div></div>`).join('');
  if(at==='users'){const {data}=await sb.from('mt_profiles').select('*').order('created_at',{ascending:false});
    body=`<label style="max-width:520px;margin-bottom:12px"><input id="q" type="search" placeholder="${t('search')}"></label>`+(data||[]).map(u=>`<div class="row urow" data-q="${esc((u.full_name+' '+u.email).toLowerCase())}"><div><b>${esc(u.full_name||u.email)}</b><small>${esc(u.email)}</small></div>${u.id===me.id?`<small>${t('you')}</small>`:`<div class="act"><select data-role="${u.id}">${['student','admin','super_admin'].map(r=>`<option value="${r}" ${r===u.role?'selected':''}>${t('r_'+r)}</option>`).join('')}</select><label style="display:flex;gap:6px;align-items:center;font-weight:500"><input style="width:auto" type="checkbox" data-act="${u.id}" ${u.is_active?'checked':''}>${t('active')}</label><button class="b s" data-reset="${esc(u.email)}" type="button">${t('resetb')}</button></div>`}</div>`).join('')}
  view(`<div class="vh up" style="margin:34px 0 0"><h2 style="margin:0">${t('dash')}</h2><a class="b s" href="#/">${t('home')}</a></div><div class="tabs">${tabs.map(x=>`<button class="b s ${x[0]===at?'on':''}" data-tab="${x[0]}" type="button">${t(x[1])}</button>`).join('')}</div>${body}`);
  if($('#uf'))$('#uf').onsubmit=upload;
  if($('#q'))$('#q').oninput=e=>{const v=e.target.value.trim().toLowerCase();$$('.urow').forEach(r=>r.hidden=!r.dataset.q.includes(v))};
  if($('#nf'))$('#nf').onsubmit=async e=>{e.preventDefault();const {error}=await sb.from('mt_announcements').insert({title:$('#nt').value.trim(),body:$('#nb').value.trim(),created_by:me.id});error?fail(error):(toast(t('posted')),admin())};
  if($('#sf'))$('#sf').onsubmit=async e=>{e.preventDefault();const name=$('#sn').value.trim(),slug=name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'subject-'+Date.now();
    const {error}=await sb.from('mt_subjects').insert({name,name_ar:$('#sa').value.trim(),slug,position:(subs?.length||0)+1});error?fail(error):(toast(t('added')),SC.d=null,admin())};
  window._subs=subs;
}
async function upload(e){
  e.preventDefault();const f=$('#uf2').files[0],b=$('#ub');
  if(!f||!(f.type==='application/pdf'||/\.pdf$/i.test(f.name)))return toast(t('choosepdf'));if(f.size>52428800)return toast(t('toobig'));
  b.disabled=true;b.textContent=t('uploading');
  const path=`${$('#us').value}/${Date.now()}_${f.name.replace(/[^\w.-]+/g,'_')}`,done=()=>{b.disabled=false;b.textContent=t('uploadb')};
  let up;try{up=await B().upload(path,f,{contentType:'application/pdf'})}catch(err){up={error:err}}if(up.error){done();return fail(up.error)}
  const {error}=await sb.from('mt_resources').insert({subject_id:$('#us').value,section:$('#uc').value,title:$('#ut').value.trim(),file_path:path,created_by:me.id});
  if(error){await B().remove([path]);done();return fail(error)}
  toast(t('uploaded'));e.target.reset();done();
}
document.addEventListener('click',async e=>{
  const x=e.target.closest('button');if(!x)return;const d=x.dataset,R=async(p,m)=>{const {error}=await p;error?fail(error):(SC.d=null,toast(t(m)),admin())};
  if(d.tab){at=d.tab;return admin()}
  if(d.view){$('#vt').textContent=d.title;$('#vf').src=sb.storage.from(CFG.bucket).getPublicUrl(d.view).data.publicUrl;$('#vo').href=$('#vf').src;$('#vd').href=d.dl;$('#vw').showModal()}
  if(x.id==='vx'){$('#vw').close();$('#vf').src='about:blank'}
  if(d.del){if(!confirm(t('sure')))return;await B().remove([d.path]);const {error}=await sb.from('mt_resources').delete().eq('id',d.del);error?fail(error):(toast(t('deleted')),route())}
  if(d.deln&&confirm(t('sure')))R(sb.from('mt_announcements').delete().eq('id',d.deln),'deleted');
  if(d.hid)R(sb.from('mt_subjects').update({hidden:d.h!=='true'}).eq('id',d.hid),'saved');
  if(d.ren){const n=prompt(t('nameEn'),d.n);if(!n||!n.trim())return;const a=prompt(t('nameAr'),d.a);if(a===null)return;R(sb.from('mt_subjects').update({name:n.trim(),name_ar:a.trim()}).eq('id',d.ren),'saved')}
  if(d.mv!==undefined){const s=[...window._subs],i=+d.mv,j=i+ +d.d;[s[i],s[j]]=[s[j],s[i]];const r=await Promise.all(s.map((q,k)=>sb.from('mt_subjects').update({position:k+1}).eq('id',q.id)));const er=r.find(q=>q.error);er?fail(er.error):(SC.d=null,admin())}
  if(d.dels){if(!confirm(t('delsubq')))return;const {data:fs}=await sb.from('mt_resources').select('file_path').eq('subject_id',d.dels);if(fs&&fs.length)await B().remove(fs.map(q=>q.file_path));R(sb.from('mt_subjects').delete().eq('id',d.dels),'deleted')}
  if(d.reset){const {error}=await sb.auth.resetPasswordForEmail(d.reset,{redirectTo:location.origin+location.pathname});error?fail(error):toast(t('resetsent'))}
});
document.addEventListener('change',async e=>{
  const x=e.target,d=x.dataset;
  if(d.role){const {error}=await sb.from('mt_profiles').update({role:x.value}).eq('id',d.role);error?(fail(error),admin()):toast(t('roleupd'))}
  if(d.act){const {error}=await sb.from('mt_profiles').update({is_active:x.checked}).eq('id',d.act);error?(fail(error),admin()):toast(t('saved'))}
});
chrome();(async()=>{await loadMe();route()})();
</script>
